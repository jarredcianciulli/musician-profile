name: Deploy

on:
  push:
    branches:
      - master
      - main
      - staging

jobs:
  deploy:
    runs-on: [self-hosted, linux, ARM64, bss]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy environment
        id: env
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "master" ] || [ "$BRANCH" = "main" ]; then
            echo "name=prod" >> "$GITHUB_OUTPUT"
            echo "compose=docker-compose.prod.yml" >> "$GITHUB_OUTPUT"
            echo "deploy_dir=$HOME/bss/studio/prod" >> "$GITHUB_OUTPUT"
          else
            echo "name=staging" >> "$GITHUB_OUTPUT"
            echo "compose=docker-compose.staging.yml" >> "$GITHUB_OUTPUT"
            echo "deploy_dir=$HOME/bss/studio/staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync files to deploy directory
        env:
          DEPLOY_DIR: ${{ steps.env.outputs.deploy_dir }}
          COMPOSE: ${{ steps.env.outputs.compose }}
        run: |
          set -euo pipefail
          mkdir -p "$DEPLOY_DIR"
          rsync -a --delete \
            --exclude node_modules \
            --exclude build \
            --exclude .next \
            --exclude .git \
            --exclude workers \
            --exclude .env \
            --exclude .env.development \
            --exclude .env.production \
            --exclude .env.local \
            ./ "$DEPLOY_DIR/"
          cp "$DEPLOY_DIR/$COMPOSE" "$DEPLOY_DIR/docker-compose.yml"
          if [ ! -f "$DEPLOY_DIR/.env" ]; then
            cp "$DEPLOY_DIR/env.production.example" "$DEPLOY_DIR/.env"
            echo "::warning::Seeded .env from env.production.example — set API URLs on the Pi."
          fi
          # Migrate CRA REACT_APP_* → NEXT_PUBLIC_* when Next keys are missing
          ENV_FILE="$DEPLOY_DIR/.env"
          for key in CONTACT_ENDPOINT STUDIO_API WEBSITE_DOMAIN LAB_URL METHOD_URL STUDIO_EMAIL; do
            if ! grep -q "^NEXT_PUBLIC_${key}=" "$ENV_FILE" 2>/dev/null; then
              val=$(grep "^REACT_APP_${key}=" "$ENV_FILE" 2>/dev/null | head -1 | cut -d= -f2- || true)
              if [ -n "${val:-}" ]; then
                echo "NEXT_PUBLIC_${key}=$val" >> "$ENV_FILE"
                echo "Migrated REACT_APP_${key} → NEXT_PUBLIC_${key}"
              fi
            fi
          done
          # Staging hostname when deploying staging branch
          if [ "${{ steps.env.outputs.name }}" = "staging" ]; then
            if grep -q "^NEXT_PUBLIC_WEBSITE_DOMAIN=https://batterystringstudio.com" "$ENV_FILE" 2>/dev/null; then
              sed -i 's|^NEXT_PUBLIC_WEBSITE_DOMAIN=https://batterystringstudio.com|NEXT_PUBLIC_WEBSITE_DOMAIN=https://staging.batterystringstudio.com|' "$ENV_FILE" || true
            fi
            if ! grep -q "^NEXT_PUBLIC_WEBSITE_DOMAIN=" "$ENV_FILE"; then
              echo "NEXT_PUBLIC_WEBSITE_DOMAIN=https://staging.batterystringstudio.com" >> "$ENV_FILE"
            fi
          fi

      - name: Build and start containers
        env:
          DEPLOY_DIR: ${{ steps.env.outputs.deploy_dir }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          NAME=$(awk '/container_name:/{print $2; exit}' docker-compose.yml || true)
          if [ -n "${NAME:-}" ]; then docker rm -f "$NAME" 2>/dev/null || true; fi
          docker compose --env-file .env up -d --build --force-recreate --remove-orphans
          docker compose ps
