<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" role="img" aria-label="Battery String Studio">
  <!--
    Original v3 poster composition + exact bow-string mark from
    battery-string-studio-logo.svg as top-left watermark with
    BATTERY / STRING / STUDIO stacked vertically.
  -->
  <defs>
    <style>
      :root {
        --field-dark: #0a0a0a;
        --field-accent: #bd2f2b;
      }
      .dark { fill: var(--field-dark); }
      .accent { fill: var(--field-accent); }
      .type-main {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 72px;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-anchor: middle;
      }
      .type-wm {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-anchor: middle;
      }
    </style>

    <!-- Exact logo mark paths from Downloads/battery-string-studio-logo.svg -->
    <g id="exact-bow-mark">
      <path d="M75,38 C95,70 30,90 55,130 C80,170 15,190 45,222" fill="none" stroke="var(--field-accent)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="75" cy="30" r="9" fill="var(--field-accent)"/>
      <circle cx="45" cy="230" r="9" fill="var(--field-accent)"/>
      <line x1="30" y1="118" x2="78" y2="140" stroke="var(--field-accent)" stroke-width="8" stroke-linecap="round"/>
    </g>

    <path
      id="accent-field"
      d="
        M 0 640 L 0 1200 L 800 1200 L 800 640
        L 620 640
        C 605 615 595 575 598 530
        C 602 470 625 420 655 385
        C 675 360 685 335 675 315
        C 662 290 630 285 605 300
        C 555 325 525 385 515 450
        C 505 510 510 575 530 640
        L 270 640
        C 290 575 295 510 285 450
        C 275 385 245 325 195 300
        C 170 285 138 290 125 315
        C 115 335 125 360 145 385
        C 175 420 198 470 202 530
        C 205 575 195 615 180 640
        Z
      "
    />
  </defs>

  <rect class="dark" width="800" height="1200" />
  <use href="#accent-field" class="accent" />

  <path d="M 155 360 C 145 320 150 280 175 260 C 200 240 235 245 250 275"
    fill="none" stroke="var(--field-accent)" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M 645 360 C 655 320 650 280 625 260 C 600 240 565 245 550 275"
    fill="none" stroke="var(--field-accent)" stroke-width="7" stroke-linecap="round"/>

  <!-- Watermark: exact logo + stacked BATTERY STRING STUDIO (accent color) -->
  <g transform="translate(40, 36)">
    <use href="#exact-bow-mark" transform="scale(0.42)"/>
    <g transform="translate(48, 128)" fill="var(--field-accent)">
      <text class="type-wm" x="0" y="0">BATTERY</text>
      <text class="type-wm" x="0" y="28">STRING</text>
      <text class="type-wm" x="0" y="56">STUDIO</text>
    </g>
  </g>

  <!-- Main stacked type — bottom field (original v3) -->
  <g transform="translate(400 0)" fill="var(--field-dark)">
    <text class="type-main" x="0" y="820">BATTERY</text>
    <text class="type-main" x="0" y="930">STRING</text>
    <text class="type-main" x="0" y="1040">STUDIO</text>
  </g>
</svg>
