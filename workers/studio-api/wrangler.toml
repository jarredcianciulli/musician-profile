name = "studio-api"
main = "src/index.js"
compatibility_date = "2024-11-07"

account_id = "6994f7f6c31b227cc8a0b96af83eb060"

# Primary BSS API host (site points REACT_APP_STUDIO_API here)
routes = [
  { pattern = "api.batterystringstudio.com/studio*", zone_name = "batterystringstudio.com" },
  # Keep legacy host during transition
  { pattern = "api.jarredcianciulli.com/studio*", zone_name = "jarredcianciulli.com" },
]

# Create with: npm run kv:create — then paste id below
# [[kv_namespaces]]
# binding = "STUDIO_KV"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
WEBSITE_DOMAIN = "https://batterystringstudio.com"
# Comma-separated extra CORS origins (staging, www, local)
CORS_ORIGINS = "https://batterystringstudio.com,https://www.batterystringstudio.com,https://staging.batterystringstudio.com,http://localhost:3000"

[env.dev.vars]
WEBSITE_DOMAIN = "http://localhost:3000"
CORS_ORIGINS = "http://localhost:3000"
