name = "studio-api"
main = "src/index.js"
compatibility_date = "2024-11-07"

# Christieandjarred account (owns batterystringstudio.com)
account_id = "60fd79cf6ab3ec1f0525b598cfaef56b"

# Custom domain (Workers → Domains): booking-api.batterystringstudio.com
# Prefer custom domain over zone routes — api.* is already used by the tunnel/Caddy stack.
# Zone Workers Routes Edit is also required if you switch back to routes on api.*.
# routes = [
#   { pattern = "api.batterystringstudio.com/studio*", zone_name = "batterystringstudio.com" },
# ]

[[kv_namespaces]]
binding = "STUDIO_KV"
id = "628e269674a74751b113c64d7dbd7a33"

[vars]
WEBSITE_DOMAIN = "https://batterystringstudio.com"
# Comma-separated extra CORS origins (staging, www, local)
CORS_ORIGINS = "https://batterystringstudio.com,https://www.batterystringstudio.com,https://staging.batterystringstudio.com,http://localhost:3000"

[env.dev.vars]
WEBSITE_DOMAIN = "http://localhost:3000"
CORS_ORIGINS = "http://localhost:3000"
